name: Daily Job Pull & Sync to Turso

on:
  schedule:
    # Runs at 02:00 UTC daily (4 hours before Jaithraya's nightly pull at 8:00 PM ET)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enrich & Index Local Database
        run: |
          python3 scripts/enrich_database.py

      - name: Sync Verified Active US Jobs to Turso Cloud
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ -n "$TURSO_DATABASE_URL" ] && [ -n "$TURSO_AUTH_TOKEN" ]; then
            python3 scripts/sync_to_turso.py
          else
            echo "TURSO secrets not configured. Skipping remote cloud sync."
          fi
